name: multi-channel-order-platform

services:
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      WEBSITE_READER_PASSWORD: ${WEBSITE_READER_PASSWORD:?set WEBSITE_READER_PASSWORD in .env}
      WEBSITE_WRITER_PASSWORD: ${WEBSITE_WRITER_PASSWORD:?set WEBSITE_WRITER_PASSWORD in .env}
      MARKETPLACE_WRITER_PASSWORD: ${MARKETPLACE_WRITER_PASSWORD:?set MARKETPLACE_WRITER_PASSWORD in .env}
      PLATFORM_INGEST_PASSWORD: ${PLATFORM_INGEST_PASSWORD:?set PLATFORM_INGEST_PASSWORD in .env}
      PLATFORM_TRANSFORM_PASSWORD: ${PLATFORM_TRANSFORM_PASSWORD:?set PLATFORM_TRANSFORM_PASSWORD in .env}
      PLATFORM_PUBLISHER_PASSWORD: ${PLATFORM_PUBLISHER_PASSWORD:?set PLATFORM_PUBLISHER_PASSWORD in .env}
      PLATFORM_REPORT_PASSWORD: ${PLATFORM_REPORT_PASSWORD:?set PLATFORM_REPORT_PASSWORD in .env}
      AIRFLOW_APP_PASSWORD: ${AIRFLOW_APP_PASSWORD:?set AIRFLOW_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/bootstrap:/docker-entrypoint-initdb.d:ro
      - ../migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 256mb

  website-simulator:
    profiles: ["m02"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.simulator
    environment:
      WEBSITE_DB_HOST: postgres
      WEBSITE_DB_PORT: 5432
      WEBSITE_WRITER_PASSWORD: ${WEBSITE_WRITER_PASSWORD:?set WEBSITE_WRITER_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  website-collector:
    profiles: ["m02"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.ingestion
    environment:
      WEBSITE_DB_HOST: postgres
      WEBSITE_DB_PORT: 5432
      WEBSITE_READER_PASSWORD: ${WEBSITE_READER_PASSWORD:?set WEBSITE_READER_PASSWORD in .env}
      PLATFORM_DB_HOST: postgres
      PLATFORM_DB_PORT: 5432
      PLATFORM_INGEST_PASSWORD: ${PLATFORM_INGEST_PASSWORD:?set PLATFORM_INGEST_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  dbt-transform:
    profiles: ["m03"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.transform
    environment:
      PLATFORM_DB_HOST: postgres
      PLATFORM_TRANSFORM_PASSWORD: ${PLATFORM_TRANSFORM_PASSWORD:?set PLATFORM_TRANSFORM_PASSWORD in .env}
    volumes:
      - ../runtime/dbt:/app/transformations/target
    depends_on:
      postgres:
        condition: service_healthy

  platform-publisher:
    profiles: ["m03"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.transform
    environment:
      PLATFORM_DB_HOST: postgres
      PLATFORM_PUBLISHER_PASSWORD: ${PLATFORM_PUBLISHER_PASSWORD:?set PLATFORM_PUBLISHER_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  ebay-sim:
    profiles: ["m05"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.ebay
    environment:
      EBAY_SIM_TOKEN: ${EBAY_SIM_TOKEN:-local-s01-test-token}
    ports:
      - "127.0.0.1:${EBAY_API_PORT:-8081}:80"
      - "127.0.0.1:${EBAY_CONTROL_PORT:-8091}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  m05-checks:
    profiles: ["m05"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.transform
    environment:
      PLATFORM_DB_HOST: postgres
      PLATFORM_PUBLISHER_PASSWORD: ${PLATFORM_PUBLISHER_PASSWORD:?set PLATFORM_PUBLISHER_PASSWORD in .env}
      PLATFORM_INGEST_PASSWORD: ${PLATFORM_INGEST_PASSWORD:?set PLATFORM_INGEST_PASSWORD in .env}
    # Acceptance-only service; never used by the acquisition or release commands.

  ebay-collector:
    profiles: ["m05"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.ebay-collector
    environment:
      EBAY_ORIGIN: http://ebay-sim
      EBAY_SIM_TOKEN: ${EBAY_SIM_TOKEN:-local-s01-test-token}
      PLATFORM_DB_HOST: postgres
      PLATFORM_INGEST_PASSWORD: ${PLATFORM_INGEST_PASSWORD:?set PLATFORM_INGEST_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      ebay-sim:
        condition: service_healthy

  etsy-sim:
    profiles: ["m06"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.etsy
    environment:
      ETSY_SIM_TOKEN: ${ETSY_SIM_TOKEN:-local-s01-test-token}
    ports:
      - "127.0.0.1:${ETSY_API_PORT:-8082}:80"
      - "127.0.0.1:${ETSY_CONTROL_PORT:-8092}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  etsy-receiver:
    profiles: ["m06"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.etsy-receiver
    restart: unless-stopped
    environment:
      PLATFORM_DB_HOST: postgres
      PLATFORM_INGEST_PASSWORD: ${PLATFORM_INGEST_PASSWORD:?set PLATFORM_INGEST_PASSWORD in .env}
      ETSY_ORIGIN: http://etsy-sim
      ETSY_SHOP_ID: ${ETSY_SHOP_ID:-7001}
      ETSY_SUBSCRIPTION_ID: ${ETSY_SUBSCRIPTION_ID:-local-s01}
      ETSY_SIGNING_SECRET: ${ETSY_SIGNING_SECRET:-whsec_bG9jYWwtczAxLXRlc3Qtc2VjcmV0}
      ETSY_FRESHNESS_SECONDS: ${ETSY_FRESHNESS_SECONDS:-300}
    ports:
      - "127.0.0.1:${ETSY_RECEIVER_PORT:-8083}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  scheduler-observer:
    profiles: ["m07"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.airflow
    restart: unless-stopped
    entrypoint: ["/opt/airflow/project-venv/bin/python", "-m", "orchestration.scheduler_probe"]
    environment:
      PLATFORM_DB_HOST: postgres
      PLATFORM_INGEST_PASSWORD: ${PLATFORM_INGEST_PASSWORD:?set PLATFORM_INGEST_PASSWORD in .env}
      AIRFLOW_APP_PASSWORD: ${AIRFLOW_APP_PASSWORD:?set AIRFLOW_APP_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  report:
    profiles: ["m07"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.report
    environment:
      PLATFORM_DB_HOST: postgres
      PLATFORM_REPORT_PASSWORD: ${PLATFORM_REPORT_PASSWORD:?set PLATFORM_REPORT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REPORT_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow:
    profiles: ["m04"]
    build:
      context: ..
      dockerfile: infra/python/Dockerfile.airflow
    init: true
    restart: unless-stopped
    command: ["bash", "-c", "python /opt/project/orchestration/ui_credentials.py && exec airflow standalone"]
    environment:
      AIRFLOW_APP_PASSWORD: ${AIRFLOW_APP_PASSWORD:?set AIRFLOW_APP_PASSWORD in .env}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /opt/project/orchestration/metadata_url.py
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW_UI_USERNAME: ${AIRFLOW_UI_USERNAME:-admin}
      AIRFLOW_UI_PASSWORD: ${AIRFLOW_UI_PASSWORD:-}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_UI_USERNAME:-admin}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/passwords.json
      AIRFLOW__API__WORKERS: 1
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: 1
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: 30
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      DBT_LOG_PATH: /opt/airflow/logs/dbt
      WEBSITE_DB_HOST: postgres
      WEBSITE_DB_PORT: 5432
      WEBSITE_READER_PASSWORD: ${WEBSITE_READER_PASSWORD:?set WEBSITE_READER_PASSWORD in .env}
      PLATFORM_DB_HOST: postgres
      PLATFORM_INGEST_PASSWORD: ${PLATFORM_INGEST_PASSWORD:?set PLATFORM_INGEST_PASSWORD in .env}
      PLATFORM_TRANSFORM_PASSWORD: ${PLATFORM_TRANSFORM_PASSWORD:?set PLATFORM_TRANSFORM_PASSWORD in .env}
      PLATFORM_PUBLISHER_PASSWORD: ${PLATFORM_PUBLISHER_PASSWORD:?set PLATFORM_PUBLISHER_PASSWORD in .env}
      EBAY_ORIGIN: http://ebay-sim
      EBAY_SIM_TOKEN: ${EBAY_SIM_TOKEN:-local-s01-test-token}
      WEBSITE_POLL_INTERVAL_SECONDS: ${WEBSITE_POLL_INTERVAL_SECONDS:-300}
      EBAY_POLL_INTERVAL_SECONDS: ${EBAY_POLL_INTERVAL_SECONDS:-300}
      WEBSITE_POLL_INITIAL_START: ${WEBSITE_POLL_INITIAL_START:-}
      EBAY_POLL_INITIAL_START: ${EBAY_POLL_INITIAL_START:-}
      POLL_OVERLAP_SECONDS: ${POLL_OVERLAP_SECONDS:-120}
      POLLING_DRAIN_MODE: ${POLLING_DRAIN_MODE:-false}
      ETSY_ORIGIN: http://etsy-sim
      ETSY_SIM_TOKEN: ${ETSY_SIM_TOKEN:-local-s01-test-token}
      ETSY_SHOP_ID: ${ETSY_SHOP_ID:-7001}
      ETSY_LEASE_SECONDS: ${ETSY_LEASE_SECONDS:-60}
      ETSY_INBOX_INTERVAL_SECONDS: ${ETSY_INBOX_INTERVAL_SECONDS:-300}
      ETSY_RECOVERY_INTERVAL_SECONDS: ${ETSY_RECOVERY_INTERVAL_SECONDS:-300}
      ETSY_RECOVERY_INITIAL_START: ${ETSY_RECOVERY_INITIAL_START:-}
      ETSY_RECOVERY_STREAM: ${ETSY_RECOVERY_STREAM:-receipts_polling}
      ETSY_SUBSCRIPTION_ID: ${ETSY_SUBSCRIPTION_ID:-local-s01}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ../runtime/airflow/logs:/opt/airflow/logs
      - ../runtime/airflow/state:/opt/airflow/state
      - ../runtime/dbt:/opt/project/transformations/target
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local && python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)\""]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
